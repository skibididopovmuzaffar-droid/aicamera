<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Камера в Telegram (Телефон + Сон)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; }
        .container { position: relative; display: inline-block; margin-top: 20px; }
        video, canvas.overlay { width: 640px; height: 480px; transform: scaleX(-1); }
        canvas.overlay { position: absolute; top: 0; left: 0; }
        #status { margin-top: 15px; font-weight: bold; color: #00ff00; font-size: 18px;}
    </style>
</head>
<body>

    <h2>ИИ-Мониторинг (Телефон + Контроль сна)</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay" class="overlay"></canvas>
    </div>
    <div id="status">Загрузка ИИ...</div>

    <canvas id="snapshot" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const snapshotCanvas = document.getElementById('snapshot');
        const snapCtx = snapshotCanvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        let model;
        let lastPhoneAlertTime = 0; 
        let lastSleepAlertTime = 0;

        // Переменные для отслеживания сна
        let lastPersonBox = null;
        let stillStartTime = Date.now();
        const STILL_THRESHOLD = 15; // Пикселей (насколько должна сдвинуться рамка, чтобы считать движение)
        const SLEEP_TIME_MS = 120000; // 2 минуты без движения = тревога

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                return new Promise(resolve => video.onloadedmetadata = () => resolve(video));
            } catch (e) {
                statusDiv.innerText = "Ошибка доступа к камере: " + e.message;
            }
        }

        async function loadModel() {
            model = await cocoSsd.load();
            statusDiv.innerText = "ИИ работает. Следим за телефоном и сном...";
        }

        async function detect() {
            if (video.readyState === 4) {
                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;
                snapshotCanvas.width = video.videoWidth;
                snapshotCanvas.height = video.videoHeight;

                const predictions = await model.detect(video);
                ctx.clearRect(0, 0, overlay.width, overlay.height);

                let phoneDetected = false;
                let personDetected = false;
                let currentPersonBox = null;
                let personCount = 0;

                predictions.forEach(p => {
                    const [x, y, w, h] = p.bbox;
                    
                    if (p.class === 'person' && p.score > 0.6) {
                        personCount++;
                        personDetected = true;
                        // Берем координаты самого крупного (ближайшего) человека
                        if (!currentPersonBox || (w * h) > (currentPersonBox.w * currentPersonBox.h)) {
                            currentPersonBox = { x, y, w, h };
                        }
                        drawBox(ctx, x, y, w, h, 'lime', 'Сотрудник');
                    } else if (p.class === 'cell phone' && p.score > 0.5) {
                        phoneDetected = true;
                        drawBox(ctx, x, y, w, h, 'red', 'ТЕЛЕФОН!');
                    }
                });

                // --- ЛОГИКА 1: ТЕЛЕФОН ---
                if (phoneDetected && Date.now() - lastPhoneAlertTime > 15000) {
                    lastPhoneAlertTime = Date.now();
                    let alertText = `🚨 <b>Нарушение!</b>\nСотрудник использует телефон.\nЛюдей в кадре: ${personCount}`;
                    captureAndSend(alertText);
                }

                // --- ЛОГИКА 2: СОН (Отсутствие движения) ---
                if (personDetected && currentPersonBox) {
                    if (lastPersonBox) {
                        // Считаем, насколько сдвинулась рамка
                        const diffX = Math.abs(currentPersonBox.x - lastPersonBox.x);
                        const diffY = Math.abs(currentPersonBox.y - lastPersonBox.y);

                        // Если сдвиг меньше порога (человек не двигается)
                        if (diffX < STILL_THRESHOLD && diffY < STILL_THRESHOLD) {
                            // Если он не двигается уже долго
                            if (Date.now() - stillStartTime > SLEEP_TIME_MS && Date.now() - lastSleepAlertTime > 60000) {
                                lastSleepAlertTime = Date.now();
                                stillStartTime = Date.now(); // Сбрасываем таймер
                                let alertText = `😴 <b>Тревога!</b>\nСотрудник не двигается более 2 минут.\nВозможно, спит или отошел.`;
                                captureAndSend(alertText);
                            }
                        } else {
                            // Человек пошевелился — сбрасываем таймер неподвижности
                            stillStartTime = Date.now();
                        }
                    }
                    lastPersonBox = currentPersonBox;
                } else {
                    // Если человека нет в кадре, сбрасываем таймеры
                    lastPersonBox = null;
                    stillStartTime = Date.now();
                }
            }
            requestAnimationFrame(detect);
        }

        function drawBox(context, x, y, w, h, color, label) {
            context.strokeStyle = color;
            context.lineWidth = 3;
            context.strokeRect(x, y, w, h);
            context.fillStyle = color;
            context.font = 'bold 16px Arial';
            context.fillText(label, x, y - 5);
        }

        async function captureAndSend(text) {
            statusDiv.innerText = "📸 Отправка алерта в Telegram...";
            
            snapCtx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
            snapCtx.drawImage(overlay, 0, 0);

            snapshotCanvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, 'alert.jpg');
                formData.append('message', text);

                try {
                    const response = await fetch('send_photo.php', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if (result.status === 'success') {
                        statusDiv.innerText = "✅ Алерт успешно отправлен!";
                        setTimeout(() => statusDiv.innerText = "ИИ работает. Следим...", 3000);
                    } else {
                        statusDiv.innerText = "❌ Ошибка: " + result.message;
                    }
                } catch (e) {
                    statusDiv.innerText = "❌ Ошибка сети. Проверьте сервер.";
                }
            }, 'image/jpeg', 0.8);
        }

        window.onload = async () => {
            await setupCamera();
            await loadModel();
            detect();
        };
    </script>
</body>
</html>
